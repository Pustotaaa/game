name: Gameplay checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check movement, attack range and startup
        run: node --test tests/gameplay.test.cjs
